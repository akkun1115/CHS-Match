name: CHS-Match smoke tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-geometric==2.6.1 numpy networkx tqdm pytest
      - name: Ensure no benchmark tensors are tracked
        run: |
          test -z "$(git ls-files 'benchmark/*.pt' 'benchmark/**/*.pt')"
          bash -n scripts/build_benchmark.sh
          python -m compileall -q chs_match preprocess scripts tests
          python preprocess/01_prepare_source_graphs.py --help >/dev/null
          python preprocess/02_search_node_disjoint_partition.py --help >/dev/null
          python preprocess/03_generate_node_disjoint_pairs.py --help >/dev/null
          python preprocess/04_build_multi_positive_ground_truth.py --help >/dev/null
      - name: Run small CPU tests
        run: python -m pytest -q tests
